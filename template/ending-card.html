<!doctype html>
<!-- Source for ending-card.png (RiskSignal weekly sign-off). Not pasted into WeChat; rendered to an image by
     render_ending_card.sh at 360 CSS px (phone column width) x3. Edit the text here, then re-render. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #FFFFFF; }
  body { width: 360px; font-family: 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
         -webkit-font-smoothing: antialiased; }
  .card { background: #0E1726; padding: 24px 22px 22px; }
  /* reversed horizontal logo: 150px wide (>= 120px minimum); padding/margins >= one signal-dot diameter (~8px) */
  .logo { display: block; width: 150px; height: auto; margin: 0 0 18px; }
  .cta { margin: 0 0 14px; font-size: 15px; font-weight: 600; line-height: 1.75; color: #FFFFFF; letter-spacing: 0.2px; }
  .cta b { color: #F2501E; font-weight: 700; }
  .contact { margin: 0; font-size: 12.5px; line-height: 1.75; color: #9AA6B8; }
  .contact span { color: #C9D1DC; letter-spacing: 0.2px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo-reversed.png" alt="RiskSignal">
    <p class="cta">如果你觉得这期周报有收获，<br>欢迎<b>点赞、关注、收藏、转发</b>，我们下周见。</p>
    <p class="contact">如有合作意向或建议，欢迎联系：<br><span>fhw0912@gmail.com</span></p>
  </div>
</body>
</html>
